    <script>


        // =====================================================
        // Cloud Run API
        // =====================================================

        const API_URL =
            "https://meron-ai-api-281908486591.asia-northeast1.run.app/api/chat";

        const FEEDBACK_API_URL =
            API_URL.replace(/\/chat\/?$/, "/feedback");


        // =====================================================
        // 端末識別ID
        //
        // 団員による入力操作はありません。
        // ブラウザ内で自動生成します。
        // =====================================================

        function getClientId() {

            const storageKey =
                "meron_ai_client_id";


            let clientId =
                localStorage.getItem(
                    storageKey
                );


            if (!clientId) {

                if (
                    window.crypto
                    &&
                    typeof window.crypto.randomUUID
                    === "function"
                ) {

                    clientId =
                        window.crypto.randomUUID();

                } else {

                    clientId =
                        "client-"
                        + Date.now()
                        + "-"
                        + Math.random()
                            .toString(36)
                            .substring(
                                2,
                                15
                            );
                }


                localStorage.setItem(
                    storageKey,
                    clientId
                );
            }


            return clientId;
        }


        const CLIENT_ID =
            getClientId();


        // =====================================================
        // Markdown
        // =====================================================

        if (
            typeof marked
            !== "undefined"
        ) {

            marked.setOptions({

                breaks:
                    true,

                gfm:
                    true
            });

        }


        // =====================================================
        // APIエラー
        // =====================================================

        class ApiError
            extends Error {

            constructor(
                status,
                message
            ) {

                super(
                    message
                );

                this.status =
                    status;
            }
        }


        // =====================================================
        // Send
        // =====================================================

        async function handleSendMessage(
            event
        ) {

            event.preventDefault();


            const inputEl =
                document.getElementById(
                    "userInput"
                );


            const sendButton =
                document.getElementById(
                    "sendButton"
                );


            const message =
                inputEl.value.trim();


            if (!message) {
                return;
            }


            // ---------------------------------------------
            // User message
            // ---------------------------------------------

            appendMessage(
                message,
                "user"
            );


            inputEl.value =
                "";

            inputEl.disabled =
                true;

            sendButton.disabled =
                true;


            // ---------------------------------------------
            // Loading
            // ---------------------------------------------

            const loadingId =
                "loading-"
                + Date.now();


            appendLoadingMessage(
                loadingId
            );


            try {

                // -----------------------------------------
                // API
                // -----------------------------------------

                const response =
                    await fetch(

                        API_URL,

                        {

                            method:
                                "POST",


                            headers: {

                                "Content-Type":
                                    "application/json",

                                "X-Client-Id":
                                    CLIENT_ID
                            },


                            body:
                                JSON.stringify({

                                    message:
                                        message
                                })
                        }
                    );


                // -----------------------------------------
                // Response JSON
                // -----------------------------------------

                let data =
                    null;


                try {

                    data =
                        await response.json();

                } catch {

                    data =
                        null;
                }


                // -----------------------------------------
                // HTTP error
                // -----------------------------------------

                if (!response.ok) {

                    let errorMessage =
                        "";


                    if (
                        data
                        &&
                        typeof data.detail
                        === "string"
                    ) {

                        errorMessage =
                            data.detail;
                    }


                    // 429
                    if (
                        response.status
                        === 429
                    ) {

                        throw new ApiError(

                            429,

                            errorMessage
                            ||
                            "AIの利用回数が上限に達しました。少し時間をおいてからお試しください。"
                        );
                    }


                    // 503
                    if (
                        response.status
                        === 503
                    ) {

                        throw new ApiError(

                            503,

                            errorMessage
                            ||
                            "現在AIを一時的に利用できません。少し待ってからもう一度お試しください。"
                        );
                    }


                    // 400
                    if (
                        response.status
                        === 400
                    ) {

                        throw new ApiError(

                            400,

                            errorMessage
                            ||
                            "入力内容を確認してください。"
                        );
                    }


                    // Other
                    throw new ApiError(

                        response.status,

                        errorMessage
                        ||
                        "AIサーバーでエラーが発生しました。"
                    );
                }


                // -----------------------------------------
                // Success
                // -----------------------------------------

                removeMessage(
                    loadingId
                );


                appendMessage(

                    data?.reply
                    ||
                    "回答を取得できませんでした。",

                    "ai",

                    data?.sources
                    ||
                    [],

                    data?.response_id,

                    data?.feedback_token
                );


            } catch (error) {

                console.error(
                    error
                );


                removeMessage(
                    loadingId
                );


                let userMessage =
                    "";


                // -----------------------------------------
                // Rate limit
                // -----------------------------------------

                if (
                    error instanceof ApiError
                    &&
                    error.status === 429
                ) {

                    userMessage =
                        "⏳ "
                        + error.message;
                }


                // -----------------------------------------
                // Temporary unavailable
                // -----------------------------------------

                else if (
                    error instanceof ApiError
                    &&
                    error.status === 503
                ) {

                    userMessage =
                        "🔧 "
                        + error.message;
                }


                // -----------------------------------------
                // Bad request
                // -----------------------------------------

                else if (
                    error instanceof ApiError
                    &&
                    error.status === 400
                ) {

                    userMessage =
                        "⚠️ "
                        + error.message;
                }


                // -----------------------------------------
                // Server error
                // -----------------------------------------

                else if (
                    error instanceof ApiError
                ) {

                    userMessage =
                        "申し訳ありません。"
                        + "AIサーバーでエラーが発生しました。"
                        + "\n\n"
                        + "少し待ってから、もう一度お試しください。";
                }


                // -----------------------------------------
                // Network error
                // -----------------------------------------

                else {

                    userMessage =
                        "申し訳ありません。"
                        + "AIサーバーへ接続できませんでした。"
                        + "\n\n"
                        + "通信環境を確認して、"
                        + "少し待ってからもう一度お試しください。";
                }


                appendMessage(
                    userMessage,
                    "ai"
                );


            } finally {

                inputEl.disabled =
                    false;


                sendButton.disabled =
                    false;


                inputEl.focus();
            }
        }


        // =====================================================
        // Loading
        // =====================================================

        function appendLoadingMessage(
            id
        ) {

            const chatMessages =
                document.getElementById(
                    "chatMessages"
                );


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.id =
                id;


            wrapper.className =
                "flex items-start gap-3";


            const avatar =
                document.createElement(
                    "div"
                );


            avatar.className =
                "w-9 h-9 rounded-xl "
                + "bg-amber-500/20 "
                + "border border-amber-500/40 "
                + "flex items-center "
                + "justify-center "
                + "text-base "
                + "shrink-0 "
                + "shadow-lg";


            avatar.textContent =
                "🤖";


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "bg-slate-900/90 "
                + "border border-slate-800 "
                + "rounded-2xl "
                + "rounded-tl-none "
                + "px-4 py-3 "
                + "text-sm "
                + "text-slate-400 "
                + "max-w-[85%] "
                + "shadow "
                + "animate-pulse";


            bubble.textContent =
                "回答を考えています...";


            wrapper.appendChild(
                avatar
            );


            wrapper.appendChild(
                bubble
            );


            chatMessages.appendChild(
                wrapper
            );


            scrollChatToBottom();
        }


        // =====================================================
        // Remove message
        // =====================================================

        function removeMessage(
            id
        ) {

            const element =
                document.getElementById(
                    id
                );


            if (element) {

                element.remove();
            }
        }


        // =====================================================
        // Append message
        // =====================================================

        function appendMessage(
            text,
            sender,
            sources = [],
            responseId = null,
            feedbackToken = null
        ) {

            const chatMessages =
                document.getElementById(
                    "chatMessages"
                );


            const isUser =
                sender === "user";


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                `flex items-start gap-3 ${isUser
                    ? "flex-row-reverse"
                    : ""
                }`;


            // ---------------------------------------------
            // Avatar
            // ---------------------------------------------

            const avatar =
                document.createElement(
                    "div"
                );


            avatar.className =
                "w-9 h-9 rounded-xl "
                + "flex items-center "
                + "justify-center "
                + "text-base "
                + "shrink-0 "
                + "shadow-lg "
                + (
                    isUser

                        ? "bg-indigo-500/20 "
                        + "border border-indigo-500/40 "
                        + "text-indigo-300"

                        : "bg-amber-500/20 "
                        + "border border-amber-500/40 "
                        + "text-amber-300"
                );


            avatar.textContent =
                isUser
                    ? "👤"
                    : "🤖";


            // ---------------------------------------------
            // Bubble
            // ---------------------------------------------

            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "rounded-2xl "
                + "px-4 py-3 "
                + "text-sm "
                + "max-w-[85%] "
                + "leading-relaxed "
                + "shadow "
                + (
                    isUser

                        ? "bg-indigo-600 "
                        + "text-white "
                        + "rounded-tr-none"

                        : "bg-slate-900/90 "
                        + "border border-slate-800 "
                        + "text-slate-200 "
                        + "rounded-tl-none"
                );


            // ---------------------------------------------
            // User
            // ---------------------------------------------

            if (isUser) {

                const messageText =
                    document.createElement(
                        "div"
                    );


                messageText.style.whiteSpace =
                    "pre-wrap";


                messageText.textContent =
                    text;


                bubble.appendChild(
                    messageText
                );
            }


            // ---------------------------------------------
            // AI
            // ---------------------------------------------

            else {

                const messageText =
                    document.createElement(
                        "div"
                    );


                messageText.className =
                    "markdown-body";


                if (
                    typeof marked
                    !== "undefined"
                    &&
                    typeof DOMPurify
                    !== "undefined"
                ) {

                    const rawHtml =
                        marked.parse(
                            text
                        );


                    messageText.innerHTML =
                        DOMPurify.sanitize(
                            rawHtml
                        );

                } else {

                    messageText.style.whiteSpace =
                        "pre-wrap";


                    messageText.textContent =
                        text;
                }


                messageText
                    .querySelectorAll(
                        "a"
                    )
                    .forEach(
                        link => {

                            link.target =
                                "_blank";

                            link.rel =
                                "noopener noreferrer";
                        }
                    );


                bubble.appendChild(
                    messageText
                );


                // -----------------------------------------
                // Formation warning
                // -----------------------------------------

                const hasFormationSource =
                    Array.isArray(
                        sources
                    )
                    &&
                    sources.some(
                        source =>
                            source.type
                            === "formation"
                    );


                if (
                    hasFormationSource
                ) {

                    const notice =
                        document.createElement(
                            "div"
                        );


                    notice.className =
                        "mt-4 "
                        + "px-3 py-2.5 "
                        + "rounded-xl "
                        + "border "
                        + "border-amber-500/20 "
                        + "bg-amber-500/5 "
                        + "text-[11px] "
                        + "leading-relaxed "
                        + "text-amber-200/80";


                    notice.textContent =
                        "⚠️ 編成スクリーンショットの"
                        + "AI画像解析を含む回答です。"
                        + "キャラクター・武器・召喚石などの"
                        + "細かな名称は誤認する場合があります。"
                        + "最終確認は元の投稿画像をご覧ください。";


                    bubble.appendChild(
                        notice
                    );
                }


                appendSources(
                    bubble,
                    sources
                );

                if (
                    responseId
                    &&
                    feedbackToken
                ) {
                    appendFeedbackUI(
                        bubble,
                        responseId,
                        feedbackToken
                    );
                }
            }


            wrapper.appendChild(
                avatar
            );


            wrapper.appendChild(
                bubble
            );


            chatMessages.appendChild(
                wrapper
            );


            scrollChatToBottom();
        }


        // =====================================================
        // Sources
        // =====================================================

        function appendSources(
            bubble,
            sources
        ) {

            if (
                !Array.isArray(
                    sources
                )
                ||
                sources.length
                === 0
            ) {

                return;
            }


            const sourceBox =
                document.createElement(
                    "div"
                );


            sourceBox.className =
                "mt-4 "
                + "pt-3 "
                + "border-t "
                + "border-slate-700/70";


            const sourceTitle =
                document.createElement(
                    "div"
                );


            sourceTitle.className =
                "text-[11px] "
                + "text-slate-500 "
                + "mb-2 "
                + "font-semibold "
                + "tracking-wide";


            sourceTitle.textContent =
                "📚 参照元";


            sourceBox.appendChild(
                sourceTitle
            );


            sources.forEach(
                source => {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "text-xs "
                        + "text-slate-400 "
                        + "mb-1.5 "
                        + "flex "
                        + "items-start "
                        + "gap-1.5";


                    const sourceType =
                        source.type
                        ||
                        "internal";


                    const icon =
                        getSourceIcon(
                            sourceType
                        );


                    const sourceName =
                        cleanSourceName(

                            source.name
                            ||
                            "不明な参照元",

                            sourceType
                        );


                    const iconSpan =
                        document.createElement(
                            "span"
                        );


                    iconSpan.textContent =
                        icon;


                    iconSpan.className =
                        "shrink-0";


                    row.appendChild(
                        iconSpan
                    );


                    if (
                        source.url
                    ) {

                        const link =
                            document.createElement(
                                "a"
                            );


                        link.href =
                            source.url;


                        link.target =
                            "_blank";


                        link.rel =
                            "noopener noreferrer";


                        link.className =
                            "text-sky-400 "
                            + "hover:text-sky-300 "
                            + "underline "
                            + "underline-offset-2 "
                            + "break-all";


                        link.textContent =
                            sourceName;


                        row.appendChild(
                            link
                        );

                    } else {

                        const textSpan =
                            document.createElement(
                                "span"
                            );


                        textSpan.textContent =
                            sourceName;


                        row.appendChild(
                            textSpan
                        );
                    }


                    sourceBox.appendChild(
                        row
                    );
                }
            );


            bubble.appendChild(
                sourceBox
            );
        }


        // =====================================================
        // Source icon
        // =====================================================

        function getSourceIcon(
            sourceType
        ) {

            switch (
            sourceType
            ) {

                case "web":
                    return "🌐";


                case "file":
                    return "📄";


                case "formation":
                    return "⚔️";


                case "internal":
                    return "🍈";


                default:
                    return "📚";
            }
        }


        // =====================================================
        // Source name
        // =====================================================

        function cleanSourceName(
            name,
            sourceType
        ) {

            let cleaned =
                String(
                    name
                );


            if (
                sourceType
                === "formation"
            ) {

                cleaned =
                    cleaned.replace(
                        /^⚔️\s*/,
                        ""
                    );
            }


            return cleaned;
        }


        // =====================================================
        // Feedback UI (Task 9)
        // =====================================================

        function appendFeedbackUI(
            bubble,
            responseId,
            feedbackToken
        ) {
            const container = document.createElement("div");
            container.className = "mt-3 pt-2.5 border-t border-slate-800/80 flex flex-col gap-2";

            let currentRating = null;
            let currentReason = null;
            let isSubmitting = false;

            const headerRow = document.createElement("div");
            headerRow.className = "flex items-center justify-between gap-2 flex-wrap";

            const label = document.createElement("span");
            label.className = "text-[11px] text-slate-400";
            label.textContent =
                "\u3053\u306e\u56de\u7b54\u306f\u5f79\u306b\u7acb\u3061\u307e\u3057\u305f\u304b\uff1f";
            headerRow.appendChild(label);

            const btnGroup = document.createElement("div");
            btnGroup.className = "flex items-center gap-1.5";

            // Positive button (Thumbs Up)
            const posBtn = document.createElement("button");
            posBtn.type = "button";
            posBtn.className = "px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1 text-xs border border-transparent";
            
            const posIcon = document.createElement("span");
            posIcon.textContent = "\uD83D\uDC4D";
            const posText = document.createElement("span");
            posText.textContent = "\u5f79\u306b\u7acb\u3063\u305f";
            posBtn.appendChild(posIcon);
            posBtn.appendChild(posText);

            // Negative button (Thumbs Down)
            const negBtn = document.createElement("button");
            negBtn.type = "button";
            negBtn.className = "px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1 text-xs border border-transparent";
            
            const negIcon = document.createElement("span");
            negIcon.textContent = "\uD83D\uDC4E";
            const negText = document.createElement("span");
            negText.textContent = "\u6539\u5584\u3057\u3066\u307b\u3057\u3044";
            negBtn.appendChild(negIcon);
            negBtn.appendChild(negText);

            btnGroup.appendChild(posBtn);
            btnGroup.appendChild(negBtn);
            headerRow.appendChild(btnGroup);
            container.appendChild(headerRow);

            // Reasons Box (for negative feedback)
            const reasonsBox = document.createElement("div");
            reasonsBox.className = "hidden pt-2 border-t border-slate-800/60 flex flex-col gap-1.5";

            const reasonPrompt = document.createElement("div");
            reasonPrompt.className = "text-[11px] text-amber-300/80 font-medium";
            reasonPrompt.textContent =
                "\u6539\u5584\u70b9\u3092\u6559\u3048\u3066\u304f\u3060\u3055\u3044\uff08\u9078\u629e\u3059\u308b\u3068\u9001\u4fe1\u3055\u308c\u307e\u3059\uff09";
            reasonsBox.appendChild(reasonPrompt);

            const reasonGrid = document.createElement("div");
            reasonGrid.className = "grid grid-cols-2 sm:grid-cols-3 gap-1.5";

            const reasonOptions = [
                {
                    key: "incorrect",
                    label: "\u5185\u5bb9\u304c\u9593\u9055\u3063\u3066\u3044\u308b"
                },
                {
                    key: "outdated",
                    label: "\u60c5\u5831\u304c\u53e4\u3044"
                },
                {
                    key: "missing_information",
                    label: "\u60c5\u5831\u304c\u8db3\u308a\u306a\u3044"
                },
                {
                    key: "hard_to_understand",
                    label: "\u5206\u304b\u308a\u306b\u304f\u3044"
                },
                {
                    key: "irrelevant",
                    label: "\u8cea\u554f\u3068\u95a2\u4fc2\u306a\u3044"
                },
                {
                    key: "other",
                    label: "\u305d\u306e\u4ed6"
                },
            ];

            const reasonBtnElements = {};

            reasonOptions.forEach(opt => {
                const rBtn = document.createElement("button");
                rBtn.type = "button";
                rBtn.className = "px-2 py-1.5 rounded-lg bg-slate-800/90 hover:bg-slate-700 text-slate-300 text-[11px] text-left border border-slate-700/50 transition truncate";
                rBtn.textContent = opt.label;
                rBtn.title = opt.label;
                rBtn.onclick = () => handleSendFeedback("negative", opt.key);
                reasonGrid.appendChild(rBtn);
                reasonBtnElements[opt.key] = rBtn;
            });

            reasonsBox.appendChild(reasonGrid);
            container.appendChild(reasonsBox);

            // Status message
            const statusMsg = document.createElement("div");
            statusMsg.className = "text-[11px] text-emerald-400 hidden";
            statusMsg.textContent =
                "\u2713 \u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u3042\u308a\u304c\u3068\u3046\u3054\u3056\u3044\u307e\u3059";
            container.appendChild(statusMsg);

            // Error message
            const errorMsg = document.createElement("div");
            errorMsg.className = "text-[11px] text-rose-400 hidden";
            errorMsg.textContent =
                "\u26a0\ufe0f \u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u306e\u9001\u4fe1\u306b\u5931\u6557\u3057\u307e\u3057\u305f";
            container.appendChild(errorMsg);

            function updateUIState() {
                // Reset styles
                posBtn.className = "px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1 text-xs border border-transparent";
                negBtn.className = "px-2.5 py-1 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-slate-300 transition flex items-center gap-1 text-xs border border-transparent";
                
                Object.values(reasonBtnElements).forEach(btn => {
                    btn.className = "px-2 py-1.5 rounded-lg bg-slate-800/90 hover:bg-slate-700 text-slate-300 text-[11px] text-left border border-slate-700/50 transition truncate";
                });

                if (currentRating === "positive") {
                    posBtn.className = "px-2.5 py-1 rounded-lg bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 transition flex items-center gap-1 text-xs font-semibold shadow-sm";
                    reasonsBox.classList.add("hidden");
                } else if (currentRating === "negative") {
                    negBtn.className = "px-2.5 py-1 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/40 transition flex items-center gap-1 text-xs font-semibold shadow-sm";
                    if (currentReason && reasonBtnElements[currentReason]) {
                        reasonBtnElements[currentReason].className = "px-2 py-1.5 rounded-lg bg-rose-500/20 text-rose-300 border border-rose-500/50 text-[11px] text-left font-semibold";
                    }
                }
            }

            async function handleSendFeedback(rating, reason = null) {
                // Prevent duplicate submission for identical rating and reason
                if (currentRating === rating && currentReason === reason) {
                    return;
                }

                if (isSubmitting) return;
                isSubmitting = true;
                errorMsg.classList.add("hidden");
                statusMsg.classList.add("hidden");

                try {
                    const res = await fetch(FEEDBACK_API_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            response_id: responseId,
                            feedback_token: feedbackToken,
                            rating: rating,
                            reason: reason
                        })
                    });

                    if (!res.ok) {
                        throw new Error(`HTTP ${res.status}`);
                    }

                    currentRating = rating;
                    currentReason = reason;
                    updateUIState();
                    statusMsg.classList.remove("hidden");

                } catch (err) {
                    console.error("Feedback submit error:", err);
                    errorMsg.textContent =
                        "\u26a0\ufe0f \u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u306e\u9001\u4fe1\u306b\u5931\u6557\u3057\u307e\u3057\u305f";
                    errorMsg.classList.remove("hidden");
                } finally {
                    isSubmitting = false;
                }
            }

            posBtn.onclick = () => {
                handleSendFeedback("positive", null);
            };

            negBtn.onclick = () => {
                if (currentRating === "negative" && !reasonsBox.classList.contains("hidden")) {
                    reasonsBox.classList.add("hidden");
                } else {
                    reasonsBox.classList.remove("hidden");
                }
            };

            bubble.appendChild(container);
        }


        // =====================================================
        // Scroll
        // =====================================================

        function scrollChatToBottom() {

            const chatMessages =
                document.getElementById(
                    "chatMessages"
                );


            requestAnimationFrame(
                () => {

                    chatMessages.scrollTop =
                        chatMessages.scrollHeight;
                }
            );
        }

    </script>

</body>

</html>
