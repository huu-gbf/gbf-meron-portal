    <script>

        // =====================================================
        // FastAPI
        // =====================================================

        const API_URL =
            "https://meron-ai-api-281908486591.asia-northeast1.run.app/api/chat";


        // =====================================================
        // Markdown設定
        // =====================================================

        if (
            typeof marked
            !== "undefined"
        ) {

            marked.setOptions({
                breaks: true,
                gfm: true
            });

        }


        // =====================================================
        // メッセージ送信
        // =====================================================

        async function handleSendMessage(
            e
        ) {

            e.preventDefault();


            const inputEl =
                document.getElementById(
                    "userInput"
                );


            const sendButton =
                document.getElementById(
                    "sendButton"
                );


            const message =
                inputEl.value.trim();


            if (!message) {
                return;
            }


            // ---------------------------------------------
            // ユーザー発言表示
            // ---------------------------------------------

            appendMessage(
                message,
                "user"
            );


            inputEl.value = "";

            inputEl.disabled = true;

            sendButton.disabled = true;


            // ---------------------------------------------
            // ローディング表示
            // ---------------------------------------------

            const loadingId =
                "loading-"
                + Date.now();


            appendLoadingMessage(
                loadingId
            );


            try {

                // -----------------------------------------
                // FastAPIへ送信
                // -----------------------------------------

                const response =
                    await fetch(
                        API_URL,
                        {

                            method:
                                "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({
                                    message:
                                        message
                                })
                        }
                    );


                // -----------------------------------------
                // HTTPエラー
                // -----------------------------------------

                if (!response.ok) {

                    let detail = "";


                    try {

                        const errorData =
                            await response.json();


                        detail =
                            errorData.detail
                            || "";

                    } catch {
                        // JSONでなくても問題なし
                    }


                    throw new Error(
                        detail
                        || "サーバー応答エラー"
                    );

                }


                // -----------------------------------------
                // JSON取得
                // -----------------------------------------

                const data =
                    await response.json();


                // -----------------------------------------
                // ローディング削除
                // -----------------------------------------

                removeMessage(
                    loadingId
                );


                // -----------------------------------------
                // AI回答表示
                // -----------------------------------------

                appendMessage(

                    data.reply
                    || "回答を取得できませんでした。",

                    "ai",

                    data.sources
                    || []
                );


            } catch (err) {

                console.error(
                    err
                );


                removeMessage(
                    loadingId
                );


                appendMessage(

                    "申し訳ありません。"
                    + "AI応答の取得中にエラーが発生しました。\n\n"
                    + "FastAPIバックエンドが"
                    + "起動しているか確認してください。",

                    "ai"
                );


            } finally {

                inputEl.disabled =
                    false;

                sendButton.disabled =
                    false;

                inputEl.focus();

            }

        }


        // =====================================================
        // ローディング
        // =====================================================

        function appendLoadingMessage(
            id
        ) {

            const chatMessages =
                document.getElementById(
                    "chatMessages"
                );


            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.id =
                id;


            wrapper.className =
                "flex items-start gap-3";


            const avatar =
                document.createElement(
                    "div"
                );


            avatar.className =
                "w-9 h-9 rounded-xl "
                + "bg-amber-500/20 "
                + "border border-amber-500/40 "
                + "flex items-center "
                + "justify-center "
                + "text-base "
                + "shrink-0 "
                + "shadow-lg";


            avatar.textContent =
                "🤖";


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "bg-slate-900/90 "
                + "border border-slate-800 "
                + "rounded-2xl "
                + "rounded-tl-none "
                + "px-4 py-3 "
                + "text-sm "
                + "text-slate-400 "
                + "max-w-[85%] "
                + "shadow "
                + "animate-pulse";


            bubble.textContent =
                "回答を考えています...";


            wrapper.appendChild(
                avatar
            );


            wrapper.appendChild(
                bubble
            );


            chatMessages.appendChild(
                wrapper
            );


            scrollChatToBottom();

        }


        // =====================================================
        // メッセージ削除
        // =====================================================

        function removeMessage(
            id
        ) {

            const element =
                document.getElementById(
                    id
                );


            if (element) {

                element.remove();

            }

        }


        // =====================================================
        // メッセージ表示
        // =====================================================

        function appendMessage(
            text,
            sender,
            sources = []
        ) {

            const chatMessages =
                document.getElementById(
                    "chatMessages"
                );


            const isUser =
                sender === "user";


            // ---------------------------------------------
            // 外枠
            // ---------------------------------------------

            const wrapper =
                document.createElement(
                    "div"
                );


            wrapper.className =
                `flex items-start gap-3 ${isUser
                    ? "flex-row-reverse"
                    : ""
                }`;


            // ---------------------------------------------
            // アイコン
            // ---------------------------------------------

            const avatar =
                document.createElement(
                    "div"
                );


            avatar.className =
                "w-9 h-9 rounded-xl "
                + "flex items-center "
                + "justify-center "
                + "text-base "
                + "shrink-0 "
                + "shadow-lg "
                + (
                    isUser
                        ? "bg-indigo-500/20 "
                        + "border border-indigo-500/40 "
                        + "text-indigo-300"

                        : "bg-amber-500/20 "
                        + "border border-amber-500/40 "
                        + "text-amber-300"
                );


            avatar.textContent =
                isUser
                    ? "👤"
                    : "🤖";


            // ---------------------------------------------
            // 吹き出し
            // ---------------------------------------------

            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "rounded-2xl "
                + "px-4 py-3 "
                + "text-sm "
                + "max-w-[85%] "
                + "leading-relaxed "
                + "shadow "
                + (
                    isUser

                        ? "bg-indigo-600 "
                        + "text-white "
                        + "rounded-tr-none"

                        : "bg-slate-900/90 "
                        + "border border-slate-800 "
                        + "text-slate-200 "
                        + "rounded-tl-none"
                );


            // ---------------------------------------------
            // ユーザー
            // ---------------------------------------------

            if (isUser) {

                const messageText =
                    document.createElement(
                        "div"
                    );


                messageText.style.whiteSpace =
                    "pre-wrap";


                messageText.textContent =
                    text;


                bubble.appendChild(
                    messageText
                );

            }

            // ---------------------------------------------
            // AI
            // ---------------------------------------------

            else {

                const messageText =
                    document.createElement(
                        "div"
                    );


                messageText.className =
                    "markdown-body";


                // Markdown描画
                if (
                    typeof marked
                    !== "undefined"
                    &&
                    typeof DOMPurify
                    !== "undefined"
                ) {

                    const rawHtml =
                        marked.parse(
                            text
                        );


                    messageText.innerHTML =
                        DOMPurify.sanitize(
                            rawHtml
                        );

                }

                // CDNが読み込めなかった場合の予備
                else {

                    messageText.style.whiteSpace =
                        "pre-wrap";


                    messageText.textContent =
                        text;

                }


                // AI回答内リンクは
                // 別タブで安全に開く
                messageText
                    .querySelectorAll(
                        "a"
                    )
                    .forEach(
                        link => {

                            link.target =
                                "_blank";

                            link.rel =
                                "noopener noreferrer";

                        }
                    );


                bubble.appendChild(
                    messageText
                );


                // -----------------------------------------
                // 編成画像解析の注意
                // -----------------------------------------

                const hasFormationSource =
                    sources.some(
                        source =>
                            source.type
                            === "formation"
                    );


                if (hasFormationSource) {

                    const notice =
                        document.createElement(
                            "div"
                        );


                    notice.className =
                        "mt-4 "
                        + "px-3 py-2.5 "
                        + "rounded-xl "
                        + "border "
                        + "border-amber-500/20 "
                        + "bg-amber-500/5 "
                        + "text-[11px] "
                        + "leading-relaxed "
                        + "text-amber-200/80";


                    notice.textContent =
                        "⚠️ 編成スクリーンショットの"
                        + "AI画像解析を含む回答です。"
                        + "キャラクター・武器・召喚石などの"
                        + "細かな名称は誤認する場合があります。"
                        + "最終確認は元の投稿画像をご覧ください。";


                    bubble.appendChild(
                        notice
                    );

                }


                // -----------------------------------------
                // 参照元
                // -----------------------------------------

                appendSources(
                    bubble,
                    sources
                );

            }


            // ---------------------------------------------
            // DOM追加
            // ---------------------------------------------

            wrapper.appendChild(
                avatar
            );


            wrapper.appendChild(
                bubble
            );


            chatMessages.appendChild(
                wrapper
            );


            scrollChatToBottom();

        }


        // =====================================================
        // 参照元
        // =====================================================

        function appendSources(
            bubble,
            sources
        ) {

            if (
                !Array.isArray(
                    sources
                )
                ||
                sources.length === 0
            ) {

                return;

            }


            const sourceBox =
                document.createElement(
                    "div"
                );


            sourceBox.className =
                "mt-4 "
                + "pt-3 "
                + "border-t "
                + "border-slate-700/70";


            // ---------------------------------------------
            // タイトル
            // ---------------------------------------------

            const sourceTitle =
                document.createElement(
                    "div"
                );


            sourceTitle.className =
                "text-[11px] "
                + "text-slate-500 "
                + "mb-2 "
                + "font-semibold "
                + "tracking-wide";


            sourceTitle.textContent =
                "📚 参照元";


            sourceBox.appendChild(
                sourceTitle
            );


            // ---------------------------------------------
            // 各参照元
            // ---------------------------------------------

            sources.forEach(
                source => {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.className =
                        "text-xs "
                        + "text-slate-400 "
                        + "mb-1.5 "
                        + "flex "
                        + "items-start "
                        + "gap-1.5";


                    const sourceType =
                        source.type
                        || "internal";


                    const icon =
                        getSourceIcon(
                            sourceType
                        );


                    const sourceName =
                        cleanSourceName(
                            source.name
                            || "不明な参照元",
                            sourceType
                        );


                    // -------------------------------------
                    // アイコン
                    // -------------------------------------

                    const iconSpan =
                        document.createElement(
                            "span"
                        );


                    iconSpan.textContent =
                        icon;


                    iconSpan.className =
                        "shrink-0";


                    row.appendChild(
                        iconSpan
                    );


                    // -------------------------------------
                    // URLあり
                    // -------------------------------------

                    if (source.url) {

                        const link =
                            document.createElement(
                                "a"
                            );


                        link.href =
                            source.url;


                        link.target =
                            "_blank";


                        link.rel =
                            "noopener noreferrer";


                        link.className =
                            "text-sky-400 "
                            + "hover:text-sky-300 "
                            + "underline "
                            + "underline-offset-2 "
                            + "break-all";


                        link.textContent =
                            sourceName;


                        row.appendChild(
                            link
                        );

                    }

                    // -------------------------------------
                    // URLなし
                    // -------------------------------------

                    else {

                        const textSpan =
                            document.createElement(
                                "span"
                            );


                        textSpan.textContent =
                            sourceName;


                        row.appendChild(
                            textSpan
                        );

                    }


                    sourceBox.appendChild(
                        row
                    );

                }
            );


            bubble.appendChild(
                sourceBox
            );

        }


        // =====================================================
        // 参照元アイコン
        // =====================================================

        function getSourceIcon(
            sourceType
        ) {

            switch (
            sourceType
            ) {

                case "web":
                    return "🌐";


                case "file":
                    return "📄";


                case "formation":
                    return "⚔️";


                case "internal":
                    return "🍈";


                default:
                    return "📚";

            }

        }


        // =====================================================
        // 参照元名称整理
        // =====================================================

        function cleanSourceName(
            name,
            sourceType
        ) {

            let cleaned =
                String(name);


            // formation側では
            // Python側ですでに⚔️が
            // 名前に入っている場合があるため除去
            if (
                sourceType
                === "formation"
            ) {

                cleaned =
                    cleaned.replace(
                        /^⚔️\s*/,
                        ""
                    );

            }


            return cleaned;

        }


        // =====================================================
        // 最下部へスクロール
        // =====================================================

        function scrollChatToBottom() {

            const chatMessages =
                document.getElementById(
                    "chatMessages"
                );


            requestAnimationFrame(
                () => {

                    chatMessages.scrollTop =
                        chatMessages.scrollHeight;

                }
            );

        }

    </script>
