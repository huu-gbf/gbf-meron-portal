<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>AI Knowledge 管理 | めろ～ん王国</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Outfit:wght@600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      background-color: #080b14;
      color: #f1f5f9;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .stars-bg {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fde047, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #38bdf8, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 230px 190px, #fde047, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      opacity: 0.28;
      pointer-events: none;
      z-index: 0;
    }

    .glass-panel {
      background: rgba(18, 24, 41, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.2);
    }

    .glow-effect {
      box-shadow: 0 0 28px -6px rgba(245, 200, 66, 0.16);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.5);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }
  </style>
</head>

<body class="min-h-screen relative">
  <div class="stars-bg"></div>

  <header class="relative z-10 border-b border-slate-800/80 bg-slate-950/80 backdrop-blur sticky top-0">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-10 h-10 rounded-xl bg-purple-500/15 border border-purple-500/30 flex items-center justify-center text-xl shrink-0">
          🧠
        </div>
        <div class="min-w-0">
          <h1 class="font-bold text-white text-base sm:text-lg truncate">
            AI Knowledge 管理
          </h1>
          <p class="text-[11px] text-slate-500">
            めろ～ん王国 管理用 (ローカル専用)
          </p>
        </div>
      </div>

      <a
        href="index.html"
        class="text-xs bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white px-3.5 py-2 rounded-xl border border-slate-700 transition whitespace-nowrap"
      >
        ← ポータルへ
      </a>
    </div>
  </header>

  <main class="relative z-10 max-w-5xl mx-auto p-4 sm:p-6 pb-16">
    <!-- ステータス表示 -->
    <div id="statusPanel" class="hidden mb-5 p-4 rounded-xl border flex items-start gap-3">
      <div id="statusIcon" class="text-xl shrink-0 mt-0.5"></div>
      <div>
        <h3 id="statusTitle" class="font-bold mb-1 text-sm"></h3>
        <p id="statusMessage" class="text-sm opacity-90 leading-relaxed"></p>
      </div>
    </div>

    <!-- 管理キー入力 -->
    <div class="glass-panel glow-effect rounded-2xl p-5 sm:p-7 mb-5">
      <h2 class="font-bold text-white mb-4 flex items-center gap-2">
        <span>🔑</span> 管理アクセス
      </h2>
      <div class="flex flex-col sm:flex-row gap-3">
        <input
          type="password"
          id="adminKeyInput"
          placeholder="管理キーを入力 (X-Admin-Key)"
          class="flex-1 bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition"
        >
        <button
          id="fetchBtn"
          onclick="fetchKnowledge()"
          class="bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg shadow-amber-900/20 whitespace-nowrap"
        >
          一覧を取得
        </button>
      </div>
      <p class="text-xs text-slate-400 mt-3">
        ※セキュリティのため、管理キーは保存されません。ページを閉じるとリセットされます。
      </p>
    </div>

    <!-- 検索・フィルタリング -->
    <div class="glass-panel rounded-2xl p-5 sm:p-7 mb-5">
      <div class="flex flex-col sm:flex-row gap-4 items-end">
        <div class="flex-1 w-full">
          <label class="block text-xs font-bold text-slate-400 mb-1">
            🔍 キーワード検索 (読込済データ対象)
          </label>
          <input
            type="text"
            id="searchInput"
            placeholder="タイトルや内容で絞り込み..."
            oninput="renderTable()"
            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-purple-500/50 focus:ring-1 focus:ring-purple-500/50 transition"
          >
        </div>
        <div class="w-full sm:w-48">
          <label class="block text-xs font-bold text-slate-400 mb-1">
            🏷️ ソース種別
          </label>
          <select
            id="sourceTypeFilter"
            onchange="renderTable()"
            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-purple-500/50 appearance-none"
          >
            <option value="">すべて</option>
            <!-- オプションはJSで動的生成 -->
          </select>
        </div>
        <div class="w-full sm:w-48">
          <label class="block text-xs font-bold text-slate-400 mb-1">
            🟢 状態
          </label>
          <select
            id="activeFilter"
            onchange="renderTable()"
            class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:outline-none focus:border-purple-500/50 appearance-none"
          >
            <option value="">すべて</option>
            <option value="true">有効のみ</option>
            <option value="false">無効のみ</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 知識一覧 -->
    <div class="glass-panel rounded-2xl overflow-hidden border border-slate-800">
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm" id="knowledgeTable">
          <thead class="bg-slate-900/60 border-b border-slate-700/50">
            <tr>
              <th class="px-4 py-3 font-medium text-slate-300 w-16">状態</th>
              <th class="px-4 py-3 font-medium text-slate-300">タイトル / ソース</th>
              <th class="px-4 py-3 font-medium text-slate-300 w-32">種別</th>
              <th class="px-4 py-3 font-medium text-slate-300 w-32">更新日時</th>
              <th class="px-4 py-3 font-medium text-slate-300 w-40 text-center">操作</th>
            </tr>
          </thead>
          <tbody id="knowledgeTbody" class="divide-y divide-slate-800/50">
            <tr>
              <td colspan="5" class="px-4 py-8 text-center text-slate-500">
                管理キーを入力し、「一覧を取得」をクリックしてください。
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- プレビューモーダル -->
  <div id="previewModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-3xl w-full max-h-[85vh] flex flex-col shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-800/30">
        <h3 class="font-bold text-white text-lg" id="modalTitle">プレビュー</h3>
        <button onclick="closePreview()" class="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-700 transition">
          ✕
        </button>
      </div>
      <div class="p-5 overflow-y-auto flex-1">
        <div class="mb-4">
          <span class="text-xs text-slate-400 font-bold block mb-1">Source URL</span>
          <div id="modalUrl" class="text-sm text-blue-400 break-all"></div>
        </div>
        <div>
          <span class="text-xs text-slate-400 font-bold block mb-1">Content</span>
          <pre id="modalContent" class="text-sm text-slate-300 whitespace-pre-wrap font-sans bg-slate-950/50 p-4 rounded-xl border border-slate-800/50"></pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://meron-ai-api-55uacuh7bq-an.a.run.app";
    let loadedKnowledge = [];

    // ==========================================
    // UI制御
    // ==========================================
    function showStatus(type, title, message) {
      const panel = document.getElementById('statusPanel');
      const icon = document.getElementById('statusIcon');
      const titleEl = document.getElementById('statusTitle');
      const msgEl = document.getElementById('statusMessage');

      panel.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-green-500/10', 'border-green-500/30', 'text-green-400');
      
      titleEl.textContent = title;
      msgEl.textContent = message;

      if (type === 'error') {
        panel.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
        icon.textContent = '❌';
      } else {
        panel.classList.add('bg-green-500/10', 'border-green-500/30', 'text-green-400');
        icon.textContent = '✅';
      }
    }

    function hideStatus() {
      document.getElementById('statusPanel').classList.add('hidden');
    }

    // ==========================================
    // API呼び出し
    // ==========================================
    async function fetchKnowledge() {
      const adminKey = document.getElementById('adminKeyInput').value.trim();
      if (!adminKey) {
        showStatus('error', '管理キーが必要です', '管理キーを入力してください。');
        return;
      }

      hideStatus();
      const btn = document.getElementById('fetchBtn');
      btn.disabled = true;
      btn.textContent = '取得中...';

      try {
        const response = await fetch(`${API_URL}/api/admin/knowledge?limit=50`, {
          headers: {
            'X-Admin-Key': adminKey
          }
        });

        if (!response.ok) {
          const text = await response.text();
          showStatus('error', '取得失敗', `HTTP ${response.status}: ${text}`);
          return;
        }

        const data = await response.json();
        loadedKnowledge = data.items || [];
        
        updateSourceTypeFilter();
        renderTable();

        showStatus('success', '取得成功', `${loadedKnowledge.length}件のデータを読み込みました。`);

      } catch (err) {
        showStatus('error', '通信エラー', err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '一覧を取得';
      }
    }

    async function toggleActive(docId, currentActive) {
      const adminKey = document.getElementById('adminKeyInput').value.trim();
      if (!adminKey) {
        showStatus('error', '管理キーが必要です', '管理キーを入力してください。');
        return;
      }

      const targetActive = !currentActive;
      const actionText = targetActive ? "有効化" : "無効化";
      
      if (!confirm(`ドキュメントを${actionText}しますか？`)) {
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/admin/knowledge/${encodeURIComponent(docId)}/active`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'X-Admin-Key': adminKey
          },
          body: JSON.stringify({ active: targetActive })
        });

        if (!response.ok) {
          const text = await response.text();
          showStatus('error', '更新失敗', `HTTP ${response.status}: ${text}`);
          return;
        }

        // ローカルデータの更新
        const doc = loadedKnowledge.find(d => d.doc_id === docId);
        if (doc) {
          doc.active = targetActive;
          doc.updated_at = new Date().toISOString(); // UI上の即時反映
        }
        
        renderTable();
        showStatus('success', '更新完了', `ドキュメントを${actionText}しました。`);

      } catch (err) {
        showStatus('error', '通信エラー', err.message);
      }
    }

    // ==========================================
    // 描画・フィルタリング
    // ==========================================
    function updateSourceTypeFilter() {
      const select = document.getElementById('sourceTypeFilter');
      const types = [...new Set(loadedKnowledge.map(item => item.source_type).filter(Boolean))];
      
      // Keep selected value if possible
      const currentVal = select.value;
      
      select.innerHTML = '<option value="">すべて</option>';
      types.forEach(type => {
        const opt = document.createElement('option');
        opt.value = type;
        opt.textContent = type;
        select.appendChild(opt);
      });
      
      if (types.includes(currentVal)) {
        select.value = currentVal;
      }
    }

    function renderTable() {
      const tbody = document.getElementById('knowledgeTbody');
      tbody.innerHTML = '';

      if (loadedKnowledge.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 5;
        td.className = 'px-4 py-8 text-center text-slate-500';
        td.textContent = 'データがありません。';
        tr.appendChild(td);
        tbody.appendChild(tr);
        return;
      }

      const searchWord = document.getElementById('searchInput').value.toLowerCase();
      const typeFilter = document.getElementById('sourceTypeFilter').value;
      const activeFilter = document.getElementById('activeFilter').value;

      let filtered = loadedKnowledge.filter(item => {
        if (typeFilter && item.source_type !== typeFilter) return false;
        
        if (activeFilter !== "") {
          const isActive = item.active !== false; // undefined/null means true
          if (activeFilter === "true" && !isActive) return false;
          if (activeFilter === "false" && isActive) return false;
        }

        if (searchWord) {
          const titleMatch = (item.title || "").toLowerCase().includes(searchWord);
          const contentMatch = (item.content || "").toLowerCase().includes(searchWord);
          const sourceMatch = (item.source || "").toLowerCase().includes(searchWord);
          if (!titleMatch && !contentMatch && !sourceMatch) {
            return false;
          }
        }

        return true;
      });

      filtered.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/30 transition group';
        
        const isActive = item.active !== false;

        // --- 状態 ---
        const tdState = document.createElement('td');
        tdState.className = 'px-4 py-3';
        const stateBadge = document.createElement('span');
        stateBadge.className = `inline-flex items-center px-2 py-0.5 rounded text-xs font-medium ${isActive ? 'bg-green-500/10 text-green-400 border border-green-500/20' : 'bg-red-500/10 text-red-400 border border-red-500/20'}`;
        stateBadge.textContent = isActive ? '有効' : '無効';
        tdState.appendChild(stateBadge);
        tr.appendChild(tdState);

        // --- タイトル / ソース ---
        const tdTitle = document.createElement('td');
        tdTitle.className = 'px-4 py-3 min-w-0';
        const titleDiv = document.createElement('div');
        titleDiv.className = 'font-medium text-slate-200 truncate max-w-[200px] sm:max-w-xs';
        titleDiv.textContent = item.title || '(無題)';
        tdTitle.appendChild(titleDiv);

        const sourceDiv = document.createElement('div');
        sourceDiv.className = 'text-xs text-slate-500 truncate max-w-[200px] sm:max-w-xs mt-0.5';
        sourceDiv.textContent = item.source || item.url || '-';
        tdTitle.appendChild(sourceDiv);
        tr.appendChild(tdTitle);

        // --- 種別 ---
        const tdType = document.createElement('td');
        tdType.className = 'px-4 py-3 text-xs text-slate-400';
        tdType.textContent = item.source_type || '-';
        tr.appendChild(tdType);

        // --- 更新日時 ---
        const tdDate = document.createElement('td');
        tdDate.className = 'px-4 py-3 text-xs text-slate-400';
        try {
          if (item.updated_at) {
            tdDate.textContent = new Date(item.updated_at).toLocaleString('ja-JP');
          } else {
            tdDate.textContent = '-';
          }
        } catch(e) {
          tdDate.textContent = item.updated_at;
        }
        tr.appendChild(tdDate);

        // --- 操作 ---
        const tdActions = document.createElement('td');
        tdActions.className = 'px-4 py-3 text-center flex items-center justify-center gap-2';
        
        const previewBtn = document.createElement('button');
        previewBtn.className = 'text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2.5 py-1.5 rounded transition border border-slate-700';
        previewBtn.textContent = 'プレビュー';
        previewBtn.onclick = () => openPreview(item);
        tdActions.appendChild(previewBtn);

        const toggleBtn = document.createElement('button');
        if (isActive) {
          toggleBtn.className = 'text-xs bg-red-900/30 hover:bg-red-800/50 text-red-400 px-2.5 py-1.5 rounded transition border border-red-900/50';
          toggleBtn.textContent = '無効にする';
        } else {
          toggleBtn.className = 'text-xs bg-green-900/30 hover:bg-green-800/50 text-green-400 px-2.5 py-1.5 rounded transition border border-green-900/50';
          toggleBtn.textContent = '再有効化';
        }
        toggleBtn.onclick = () => toggleActive(item.doc_id, isActive);
        tdActions.appendChild(toggleBtn);

        tr.appendChild(tdActions);

        tbody.appendChild(tr);
      });
    }

    // ==========================================
    // プレビューモーダル
    // ==========================================
    function openPreview(item) {
      const modal = document.getElementById('previewModal');
      const titleEl = document.getElementById('modalTitle');
      const contentEl = document.getElementById('modalContent');
      const urlContainer = document.getElementById('modalUrl');
      
      titleEl.textContent = item.title || 'プレビュー';
      contentEl.textContent = item.content || '(コンテンツなし)';
      
      urlContainer.innerHTML = '';
      if (item.url) {
        if (item.url.startsWith('http://') || item.url.startsWith('https://')) {
          const a = document.createElement('a');
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'hover:underline';
          a.textContent = item.url;
          urlContainer.appendChild(a);
        } else {
          urlContainer.textContent = item.url;
        }
      } else {
        urlContainer.textContent = '-';
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closePreview() {
      const modal = document.getElementById('previewModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }
  </script>
</body>
</html>
