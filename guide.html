<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>空路手帳472</title>
  <!-- 検索エンジン避け（初期状態：検索除外。案内時のみ一時的に外し、完了後に再度設定します） -->
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="空路手帳472 - 団員向けサイトの案内ページです。">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #080b14;
      color: #f1f5f9;
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      position: relative;
    }
    .stars-bg {
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fde047, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #38bdf8, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 160px 120px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 230px 190px, #fde047, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 300px 300px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }
    .guide-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      margin: auto;
    }
    .glass-card {
      background: rgba(18, 24, 41, 0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 1.25rem;
      padding: 2.25rem 1.75rem;
      text-align: center;
      box-shadow: 0 0 35px -5px rgba(245, 200, 66, 0.15), 0 25px 30px -10px rgba(0, 0, 0, 0.6);
    }
    .emblem {
      width: 3.5rem;
      height: 3.5rem;
      margin: 0 auto 1.25rem;
      border-radius: 9999px;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
      padding: 2px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .emblem-inner {
      width: 100%;
      height: 100%;
      background: #0d121f;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      user-select: none;
    }
    .guide-title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.04em;
      margin-bottom: 0.75rem;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }
    .guide-description {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 2rem;
      word-break: break-word;
    }
    .portal-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      min-height: 52px;
      padding: 0.875rem 1.5rem;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b45309 100%);
      color: #0f172a;
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      border-radius: 0.75rem;
      box-shadow: 0 4px 16px rgba(217, 119, 6, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.25);
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .portal-btn:hover {
      filter: brightness(1.1);
      box-shadow: 0 6px 22px rgba(217, 119, 6, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }
    .portal-btn:active {
      transform: translateY(1px);
      box-shadow: 0 2px 8px rgba(217, 119, 6, 0.4);
    }
    .btn-arrow {
      font-size: 1.1rem;
      transition: transform 0.2s ease;
    }
    .portal-btn:hover .btn-arrow {
      transform: translateX(3px);
    }
    @media (max-width: 360px) {
      .glass-card {
        padding: 1.75rem 1.25rem;
      }
      .guide-title {
        font-size: 1.5rem;
      }
      .guide-description {
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }
      .portal-btn {
        min-height: 48px;
        font-size: 0.95rem;
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="stars-bg" aria-hidden="true"></div>
  <main class="guide-container">
    <div class="glass-card">
      <div class="emblem" aria-hidden="true">
        <div class="emblem-inner">⚔️</div>
      </div>
      <h1 class="guide-title">空路手帳472</h1>
      <p class="guide-description">団員向けサイトの案内ページです。</p>
      <a href="./index.html" class="portal-btn" id="open-portal-btn">
        <span>団サイトを開く</span>
        <span class="btn-arrow" aria-hidden="true">→</span>
      </a>
    </div>
  </main>
</body>
</html>
